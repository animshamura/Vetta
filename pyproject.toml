[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hernness"
version = "1.0.0"
description = "An API and CLI for an adversarial AI code-verification harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "openai>=1.68,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
hernness = "hernness.cli:main"
hernness-api = "hernness.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
