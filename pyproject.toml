[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vetta"
version = "1.0.0"
description = "An API and CLI for an adversarial AI code-verification harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.5,<6",
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "openai>=1.68,<3",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "structlog>=25,<26",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
vetta = "vetta.cli:main"
vetta-api = "vetta.api:main"
vetta-worker = "vetta.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
