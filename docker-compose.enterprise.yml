services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vetta
      POSTGRES_USER: vetta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetta -d vetta"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VETTA_ENVIRONMENT: production
      VETTA_DATABASE_URL: postgresql://vetta:${POSTGRES_PASSWORD}@postgres:5432/vetta
      VETTA_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      VETTA_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      VETTA_API_TOKEN: ${VETTA_API_TOKEN:?Set VETTA_API_TOKEN}
      VETTA_CORS_ORIGINS: ${VETTA_CORS_ORIGINS:-["http://localhost:5173"]}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["vetta-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VETTA_ENVIRONMENT: production
      VETTA_DATABASE_URL: postgresql://vetta:${POSTGRES_PASSWORD}@postgres:5432/vetta
      VETTA_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      VETTA_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      VETTA_API_TOKEN: ${VETTA_API_TOKEN:?Set VETTA_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
  redis-data:
